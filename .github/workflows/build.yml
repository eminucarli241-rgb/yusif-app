name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repozitoriyadakı Faylları Oxumaq
      uses: actions/checkout@v4

    - name: Java Quraşdırması
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Rəsmi Gradle Quraşdırması
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Android Layihəsini Yaratmaq və İmzalamaq
      run: |
        mkdir -p app/src/main/java/com/example/yusifapp
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/assets
        
        # 1. OFLAYN SƏHİFƏ
        cat << 'EOF' > app/src/main/assets/offline.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>İnternet yoxdur</title>
            <style>
                body { font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f8f9fa; color: #333; }
                .icon { font-size: 60px; margin-bottom: 20px; }
                h1 { font-size: 22px; color: #d32f2f; margin-bottom: 10px; }
                p { font-size: 16px; color: #666; margin-bottom: 30px; line-height: 1.5; }
                button { background-color: #1a73e8; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; }
            </style>
        </head>
        <body>
            <div class="icon">📡</div>
            <h1>Bağlantı xətası</h1>
            <p>Tətbiqi istifadə etmək üçün zəhmət olmasa internet bağlantınızı yoxlayın və yenidən cəhd edin.</p>
            <button onclick="window.location.href='https://yusif.az'">Yenidən yoxla</button>
        </body>
        </html>
        EOF
        
        # İKONUN KOPYALANMASI
        if [ -f ".github/workflows/icon.png" ]; then 
            cp .github/workflows/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        elif [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi
        
        # 2. YENİ DİZAYN FAYLI (Pull-to-refresh, Progress bar, Splash screen üçün)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent">

            <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                android:id="@+id/swipeRefresh"
                android:layout_width="match_parent"
                android:layout_height="match_parent">
                <WebView
                    android:id="@+id/webView"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent" />
            </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>

            <ProgressBar
                android:id="@+id/progressBar"
                style="?android:attr/progressBarStyleHorizontal"
                android:layout_width="match_parent"
                android:layout_height="4dp"
                android:layout_alignParentTop="true"
                android:visibility="gone" />

            <!-- AÇILIŞ EKRANI (Splash Screen) -->
            <RelativeLayout
                android:id="@+id/splashScreen"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#FFFFFF"
                android:elevation="10dp">
                <ImageView
                    android:layout_width="150dp"
                    android:layout_height="150dp"
                    android:layout_centerInParent="true"
                    android:src="@mipmap/ic_launcher" />
                <ProgressBar
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_centerHorizontal="true"
                    android:layout_alignParentBottom="true"
                    android:layout_marginBottom="50dp" />
            </RelativeLayout>
        </RelativeLayout>
        EOF
        
        keytool -genkey -v -keystore app/my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -dname "CN=Yusif, OU=App, O=App, L=Baku, ST=Baku, C=AZ" -storepass 12345678 -keypass 12345678
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "YusifApp"
        include(":app")
        EOF
        
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }
        EOF
        
        # 3. YENİ KİTABXANALAR ƏLAVƏ EDİLDİ (SwipeRefreshLayout üçün)
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.example.yusifapp"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.yusifapp"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            signingConfigs {
                create("release") {
                    storeFile = file("my-release-key.jks")
                    storePassword = "12345678"
                    keyAlias = "my-alias"
                    keyPassword = "12345678"
                }
            }
            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                    signingConfig = signingConfigs.getByName("release")
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            lint {
                abortOnError = false
                checkReleaseBuilds = false
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
        }
        EOF
        
        # 4. YENİ İCAZƏLƏR ƏLAVƏ EDİLDİ (Yaddaşa yazmaq - Endirmələr üçün)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <application 
                android:label="YusifApp" 
                android:icon="@mipmap/ic_launcher"
                android:usesCleartextTraffic="true" 
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 5. ƏSAS MƏNTİQ FAYLI (Tam yeniləndi)
        cat << 'EOF' > app/src/main/java/com/example/yusifapp/MainActivity.kt
        package com.example.yusifapp
        
        import android.app.AlertDialog
        import android.app.DownloadManager
        import android.content.Context
        import android.content.Intent
        import android.graphics.Bitmap
        import android.net.ConnectivityManager
        import android.net.NetworkCapabilities
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Environment
        import android.view.View
        import android.webkit.*
        import android.widget.ProgressBar
        import android.widget.RelativeLayout
        import android.widget.Toast
        import androidx.activity.OnBackPressedCallback
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.swiperefreshlayout.widget.SwipeRefreshLayout

        class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView
            private lateinit var swipeRefresh: SwipeRefreshLayout
            private lateinit var progressBar: ProgressBar
            private lateinit var splashScreen: RelativeLayout
            private var uploadMessage: ValueCallback<Array<Uri>>? = null

            // FAYL SEÇİMİ ÜÇÜN
            private val fileChooserLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                if (result.resultCode == RESULT_OK) {
                    uploadMessage?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data))
                } else {
                    uploadMessage?.onReceiveValue(null)
                }
                uploadMessage = null
            }

            private fun isNetworkAvailable(): Boolean {
                val connectivityManager = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    val network = connectivityManager.activeNetwork ?: return false
                    val activeNetwork = connectivityManager.getNetworkCapabilities(network) ?: return false
                    return activeNetwork.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ||
                           activeNetwork.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ||
                           activeNetwork.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)
                } else {
                    @Suppress("DEPRECATION")
                    val networkInfo = connectivityManager.activeNetworkInfo
                    @Suppress("DEPRECATION")
                    return networkInfo?.isConnected ?: false
                }
            }

            private fun setCacheMode() {
                if (isNetworkAvailable()) {
                    webView.settings.cacheMode = WebSettings.LOAD_DEFAULT
                } else {
                    webView.settings.cacheMode = WebSettings.LOAD_CACHE_ELSE_NETWORK
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main) // YENİ DİZAYNI İSTİFADƏ EDİRİK
                
                webView = findViewById(R.id.webView)
                swipeRefresh = findViewById(R.id.swipeRefresh)
                progressBar = findViewById(R.id.progressBar)
                splashScreen = findViewById(R.id.splashScreen)
                
                webView.settings.javaScriptEnabled = true
                webView.settings.domStorageEnabled = true
                webView.settings.allowFileAccess = true
                webView.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                
                setCacheMode() 

                // YUXARIDAN AŞAĞI ÇƏKİB YENİLƏMƏK
                swipeRefresh.setOnRefreshListener {
                    if (isNetworkAvailable()) {
                        webView.reload()
                    } else {
                        swipeRefresh.isRefreshing = false
                        Toast.makeText(this, "İnternet bağlantısı yoxdur", Toast.LENGTH_SHORT).show()
                    }
                }

                // FAYL ENDİRMƏ (DOWNLOAD) DƏSTƏYİ
                webView.setDownloadListener { url, userAgent, contentDisposition, mimetype, _ ->
                    val request = DownloadManager.Request(Uri.parse(url))
                    request.setMimeType(mimetype)
                    request.addRequestHeader("cookie", CookieManager.getInstance().getCookie(url))
                    request.addRequestHeader("User-Agent", userAgent)
                    request.setDescription("Fayl endirilir...")
                    request.setTitle(URLUtil.guessFileName(url, contentDisposition, mimetype))
                    request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                    request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, contentDisposition, mimetype))
                    
                    val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                    dm.enqueue(request)
                    Toast.makeText(this, "Endirmə başladı...", Toast.LENGTH_LONG).show()
                }

                // YÜKLƏNMƏ XƏTTİ VƏ AÇILIŞ EKRANI
                webView.webChromeClient = object : WebChromeClient() {
                    override fun onProgressChanged(view: WebView?, newProgress: Int) {
                        progressBar.progress = newProgress
                        if (newProgress == 100) {
                            progressBar.visibility = View.GONE
                            swipeRefresh.isRefreshing = false
                            splashScreen.visibility = View.GONE // Tam yüklənəndə Splash-i gizlət
                        } else {
                            progressBar.visibility = View.VISIBLE
                        }
                    }

                    // FAYL YÜKLƏMƏK (UPLOAD) ÜÇÜN
                    override fun onShowFileChooser(webView: WebView?, filePathCallback: ValueCallback<Array<Uri>>?, fileChooserParams: FileChooserParams?): Boolean {
                        uploadMessage = filePathCallback
                        try {
                            fileChooserLauncher.launch(fileChooserParams?.createIntent())
                        } catch (e: Exception) {
                            uploadMessage = null
                            return false
                        }
                        return true
                    }
                }
                
                webView.webViewClient = object : WebViewClient() {
                    
                    override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                        super.onPageStarted(view, url, favicon)
                        setCacheMode() 
                    }

                    @Deprecated("Deprecated in Java")
                    override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                        if (url == null) return false
                        
                        if (url.startsWith("whatsapp://") || url.startsWith("tel:") || 
                            url.startsWith("mailto:") || url.startsWith("intent://") || 
                            url.contains("wa.me") || url.contains("api.whatsapp.com")) {
                            try {
                                val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                                startActivity(intent)
                                return true
                            } catch (e: Exception) {
                                return false
                            }
                        }
                        
                        if (!isNetworkAvailable()) {
                            view?.loadUrl("file:///android_asset/offline.html")
                            return true 
                        }
                        return false 
                    }

                    override fun onReceivedError(view: WebView?, request: WebResourceRequest?, error: WebResourceError?) {
                        if (request?.isForMainFrame == true) {
                            view?.stopLoading()
                            view?.loadUrl("file:///android_asset/offline.html")
                        }
                        super.onReceivedError(view, request, error)
                    }

                    @Deprecated("Deprecated in Java")
                    override fun onReceivedError(view: WebView?, errorCode: Int, description: String?, failingUrl: String?) {
                        view?.stopLoading()
                        view?.loadUrl("file:///android_asset/offline.html")
                        super.onReceivedError(view, errorCode, description, failingUrl)
                    }
                }
                
                // ÇIXIŞ ÜÇÜN TƏSDİQ PƏNCƏRƏSİ (Geri düyməsi məntiqi)
                onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                    override fun handleOnBackPressed() {
                        if (webView.canGoBack()) {
                            if (webView.url == "file:///android_asset/offline.html") {
                                finish()
                            } else {
                                webView.goBack()
                            }
                        } else {
                            AlertDialog.Builder(this@MainActivity)
                                .setTitle("Çıxış")
                                .setMessage("Proqramdan çıxmaq istədiyinizə əminsiniz?")
                                .setPositiveButton("Bəli") { _, _ -> finish() }
                                .setNegativeButton("Xeyr", null)
                                .show()
                        }
                    }
                })

                webView.loadUrl("https://yusif.az")
            }
            
            override fun onResume() {
                super.onResume()
                setCacheMode()
            }
        }
        EOF

    - name: Tətbiqi İmzalı (Release) Rejimdə Yığmaq
      run: gradle assembleRelease --stacktrace

    - name: APK Faylını Yükləməyə Hazırlamaq
      uses: actions/upload-artifact@v4
      with:
        name: YusifApp-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
