name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repozitoriyadakı Faylları Oxumaq
      uses: actions/checkout@v4

    - name: Java Quraşdırması
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Rəsmi Gradle Quraşdırması
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Android Layihəsini Yaratmaq
      run: |
        mkdir -p app/src/main/java/com/example/yusifapp
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        
        # Şəkil tam olaraq sizin yüklədiyiniz yerdən götürülür
        if [ -f ".github/workflows/icon.png" ]; then 
            cp .github/workflows/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        elif [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "YusifApp"
        include(":app")
        EOF
        
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.example.yusifapp"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.yusifapp"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            lint {
                abortOnError = false
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application 
                android:label="YusifApp" 
                android:icon="@mipmap/ic_launcher"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/example/yusifapp/MainActivity.kt
        package com.example.yusifapp
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                webView = WebView(this)
                webView.settings.javaScriptEnabled = true
                webView.settings.domStorageEnabled = true
                webView.webViewClient = WebViewClient()
                
                // Bura HTTPS qoyulub ki, ağ ekran xətası olmasın
                webView.loadUrl("https://yusif.az")
                
                setContentView(webView)
            }
            @Deprecated("Deprecated in Java")
            override fun onBackPressed() {
                if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
            }
        }
        EOF

    - name: APK-nı Yığmaq
      run: gradle assembleDebug --stacktrace

    - name: APK Faylını Yükləməyə Hazırlamaq
      uses: actions/upload-artifact@v4
      with:
        name: YusifApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
